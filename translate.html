<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Voice Translator - Real Time</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            color: white;
            overflow-x: hidden;
        }

        .header {
            background: rgba(255,255,255,0.1);
            backdrop-filter: blur(20px);
            padding: 1.5rem 2rem;
            border-bottom: 1px solid rgba(255,255,255,0.2);
            text-align: center;
        }

        .header h1 {
            font-size: 2.5rem;
            font-weight: 700;
            background: linear-gradient(45deg, #FFD700, #FFA500, #FF6B6B);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 0.5rem;
        }

        .header p {
            font-size: 1.1rem;
            opacity: 0.9;
        }

        .container {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 2rem;
            gap: 2rem;
        }

        .translator-card {
            background: rgba(255,255,255,0.1);
            backdrop-filter: blur(20px);
            border-radius: 25px;
            padding: 2.5rem;
            box-shadow: 0 15px 35px rgba(0,0,0,0.1);
            border: 1px solid rgba(255,255,255,0.2);
            max-width: 900px;
            width: 100%;
        }

        .language-selector {
            display: flex;
            justify-content: center;
            gap: 1rem;
            margin-bottom: 2rem;
            flex-wrap: wrap;
        }

        .lang-direction {
            display: flex;
            align-items: center;
            gap: 1rem;
            background: rgba(255,255,255,0.1);
            padding: 1rem 1.5rem;
            border-radius: 15px;
            border: 2px solid transparent;
            transition: all 0.3s ease;
        }

        .lang-direction.active {
            border-color: #FFD700;
            background: rgba(255,215,0,0.2);
        }

        .lang-btn {
            background: rgba(255,255,255,0.2);
            border: none;
            padding: 0.8rem 1.2rem;
            border-radius: 10px;
            color: white;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 0.9rem;
        }

        .lang-btn:hover {
            background: rgba(255,255,255,0.3);
            transform: translateY(-2px);
        }

        .lang-btn.active {
            background: linear-gradient(45deg, #FFD700, #FFA500);
            color: #333;
        }

        .swap-btn {
            background: linear-gradient(45deg, #FF6B6B, #FF8E8E);
            border: none;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            color: white;
            font-size: 1.2rem;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .swap-btn:hover {
            transform: rotate(180deg) scale(1.1);
        }

        .translation-area {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 2rem;
            margin-bottom: 2rem;
        }

        .input-section, .output-section {
            background: rgba(255,255,255,0.05);
            border-radius: 20px;
            padding: 1.5rem;
            border: 1px solid rgba(255,255,255,0.1);
        }

        .section-title {
            font-size: 1.2rem;
            font-weight: bold;
            margin-bottom: 1rem;
            text-align: center;
            color: #FFD700;
        }

        .text-display {
            background: rgba(255,255,255,0.1);
            border-radius: 15px;
            padding: 1.5rem;
            min-height: 120px;
            margin-bottom: 1rem;
            font-size: 1.1rem;
            line-height: 1.6;
            border: 2px solid transparent;
            transition: all 0.3s ease;
        }

        .text-display.listening {
            border-color: #FF6B6B;
            background: rgba(255,107,107,0.1);
        }

        .text-display.translating {
            border-color: #FFD700;
            background: rgba(255,215,0,0.1);
        }

        .voice-controls {
            display: flex;
            justify-content: center;
            gap: 1rem;
            margin-bottom: 1rem;
        }

        .voice-btn {
            background: linear-gradient(45deg, #4CAF50, #45a049);
            border: none;
            padding: 1rem 1.5rem;
            border-radius: 50px;
            color: white;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-size: 1rem;
        }

        .voice-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 5px 15px rgba(76,175,80,0.4);
        }

        .voice-btn:active, .voice-btn.recording {
            background: linear-gradient(45deg, #FF6B6B, #FF8E8E);
            animation: pulse 1.5s infinite;
        }

        .voice-btn.recording {
            pointer-events: none;
        }

        .play-btn {
            background: linear-gradient(45deg, #2196F3, #1976D2);
            border: none;
            padding: 0.8rem 1.2rem;
            border-radius: 50px;
            color: white;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .play-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(33,150,243,0.4);
        }

        .play-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }

        .status-indicator {
            text-align: center;
            padding: 1rem;
            border-radius: 15px;
            margin-bottom: 1rem;
            font-weight: bold;
            transition: all 0.3s ease;
        }

        .status-indicator.idle {
            background: rgba(108,117,125,0.2);
            color: #6c757d;
        }

        .status-indicator.listening {
            background: rgba(255,107,107,0.2);
            color: #FF6B6B;
        }

        .status-indicator.processing {
            background: rgba(255,215,0,0.2);
            color: #FFD700;
        }

        .status-indicator.ready {
            background: rgba(76,175,80,0.2);
            color: #4CAF50;
        }

        .error-message {
            background: rgba(220,53,69,0.2);
            color: #dc3545;
            padding: 1rem;
            border-radius: 10px;
            margin-top: 1rem;
            text-align: center;
            display: none;
        }

        .features {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1rem;
            margin-top: 2rem;
        }

        .feature-card {
            background: rgba(255,255,255,0.05);
            padding: 1rem;
            border-radius: 15px;
            text-align: center;
            border: 1px solid rgba(255,255,255,0.1);
        }

        .feature-icon {
            font-size: 2rem;
            margin-bottom: 0.5rem;
        }

        @media (max-width: 768px) {
            .translation-area {
                grid-template-columns: 1fr;
            }
            
            .language-selector {
                flex-direction: column;
                align-items: center;
            }
            
            .header h1 {
                font-size: 2rem;
            }
            
            .container {
                padding: 1rem;
            }
            
            .translator-card {
                padding: 1.5rem;
            }
        }

        .wave {
            display: inline-block;
            width: 4px;
            height: 20px;
            background: #FFD700;
            margin: 0 2px;
            border-radius: 2px;
            animation: wave 1.2s ease-in-out infinite;
        }

        .wave:nth-child(2) { animation-delay: 0.1s; }
        .wave:nth-child(3) { animation-delay: 0.2s; }
        .wave:nth-child(4) { animation-delay: 0.3s; }
        .wave:nth-child(5) { animation-delay: 0.4s; }

        @keyframes wave {
            0%, 40%, 100% { transform: scaleY(0.4); }
            20% { transform: scaleY(1); }
        }

        .listening-indicator {
            display: none;
            justify-content: center;
            align-items: center;
            margin: 1rem 0;
        }

        .listening-indicator.active {
            display: flex;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>🎤 Voice Translator</h1>
        <p>Real-time translation between Uzbek, Russian, and English</p>
    </div>

    <div class="container">
        <div class="translator-card">
            <div class="language-selector">
                <div class="lang-direction active" id="direction1">
                    <button class="lang-btn active" data-lang="uz-UZ" onclick="setSourceLang('uz-UZ')">O'zbek</button>
                    <div class="swap-btn" onclick="swapLanguages()">⇄</div>
                    <button class="lang-btn" data-lang="en-US" onclick="setTargetLang('en-US')">English</button>
                </div>
            </div>

            <div class="language-selector">
                <button class="lang-btn" onclick="setLanguagePair('uz-UZ', 'en-US')">O'zbek → English</button>
                <button class="lang-btn" onclick="setLanguagePair('uz-UZ', 'ru-RU')">O'zbek → Русский</button>
                <button class="lang-btn" onclick="setLanguagePair('en-US', 'uz-UZ')">English → O'zbek</button>
                <button class="lang-btn" onclick="setLanguagePair('en-US', 'ru-RU')">English → Русский</button>
                <button class="lang-btn" onclick="setLanguagePair('ru-RU', 'uz-UZ')">Русский → O'zbek</button>
                <button class="lang-btn" onclick="setLanguagePair('ru-RU', 'en-US')">Русский → English</button>
            </div>

            <div class="status-indicator idle" id="statusIndicator">
                Ready to translate
            </div>

            <div class="translation-area">
                <div class="input-section">
                    <div class="section-title" id="inputTitle">Input (O'zbek)</div>
                    <div class="text-display" id="inputText">
                        Click "Start Recording" to speak...
                    </div>
                    <div class="listening-indicator" id="listeningIndicator">
                        <div class="wave"></div>
                        <div class="wave"></div>
                        <div class="wave"></div>
                        <div class="wave"></div>
                        <div class="wave"></div>
                    </div>
                    <div class="voice-controls">
                        <button class="voice-btn" id="recordBtn" onclick="toggleRecording()">
                            🎤 Start Recording
                        </button>
                    </div>
                </div>

                <div class="output-section">
                    <div class="section-title" id="outputTitle">Output (English)</div>
                    <div class="text-display" id="outputText">
                        Translation will appear here...
                    </div>
                    <div class="voice-controls">
                        <button class="play-btn" id="playBtn" onclick="playTranslation()" disabled>
                            🔊 Play Translation
                        </button>
                    </div>
                </div>
            </div>

            <div class="error-message" id="errorMessage"></div>

            
        </div>
    </div>

    <script>
        let recognition;
        let isRecording = false;
        let currentSourceLang = 'uz-UZ';
        let currentTargetLang = 'en-US';
        let currentTranslation = '';

        const languageNames = {
            'uz-UZ': 'O\'zbek',
            'en-US': 'English', 
            'ru-RU': 'Русский'
        };

        const translations = {
            'uz-UZ': {
                'en-US': {
                    'salom': 'hello',
                    'xayr': 'goodbye',
                    'rahmat': 'thank you',
                    'kechirasiz': 'excuse me',
                    'ha': 'yes',
                    'yo\'q': 'no',
                    'men': 'I',
                    'siz': 'you',
                    'u': 'he/she',
                    'bu': 'this',
                    'nima': 'what',
                    'qayerda': 'where',
                    'qachon': 'when',
                    'nech': 'how much',
                    'yaxshi': 'good',
                    'yomon': 'bad',
                    'katta': 'big',
                    'kichik': 'small'
                },
                'ru-RU': {
                    'salom': 'привет',
                    'xayr': 'до свидания',
                    'rahmat': 'спасибо',
                    'kechirasiz': 'извините',
                    'ha': 'да',
                    'yo\'q': 'нет',
                    'men': 'я',
                    'siz': 'вы',
                    'u': 'он/она',
                    'bu': 'это',
                    'nima': 'что',
                    'qayerda': 'где',
                    'qachon': 'когда',
                    'yaxshi': 'хорошо',
                    'yomon': 'плохо'
                }
            },
            'en-US': {
                'uz-UZ': {
                    'hello': 'salom',
                    'goodbye': 'xayr',
                    'thank you': 'rahmat',
                    'excuse me': 'kechirasiz',
                    'yes': 'ha',
                    'no': 'yo\'q',
                    'i': 'men',
                    'you': 'siz',
                    'he': 'u',
                    'she': 'u',
                    'this': 'bu',
                    'what': 'nima',
                    'where': 'qayerda',
                    'when': 'qachon',
                    'good': 'yaxshi',
                    'bad': 'yomon',
                    'big': 'katta',
                    'small': 'kichik'
                },
                'ru-RU': {
                    'hello': 'привет',
                    'goodbye': 'до свидания',
                    'thank you': 'спасибо',
                    'excuse me': 'извините',
                    'yes': 'да',
                    'no': 'нет',
                    'i': 'я',
                    'you': 'вы',
                    'he': 'он',
                    'she': 'она',
                    'this': 'это',
                    'what': 'что',
                    'where': 'где',
                    'when': 'когда',
                    'good': 'хорошо',
                    'bad': 'плохо'
                }
            },
            'ru-RU': {
                'uz-UZ': {
                    'привет': 'salom',
                    'до свидания': 'xayr',
                    'спасибо': 'rahmat',
                    'извините': 'kechirasiz',
                    'да': 'ha',
                    'нет': 'yo\'q',
                    'я': 'men',
                    'вы': 'siz',
                    'он': 'u',
                    'она': 'u',
                    'это': 'bu',
                    'что': 'nima',
                    'где': 'qayerda',
                    'когда': 'qachon',
                    'хорошо': 'yaxshi',
                    'плохо': 'yomon'
                },
                'en-US': {
                    'привет': 'hello',
                    'до свидания': 'goodbye',
                    'спасибо': 'thank you',
                    'извините': 'excuse me',
                    'да': 'yes',
                    'нет': 'no',
                    'я': 'i',
                    'вы': 'you',
                    'он': 'he',
                    'она': 'she',
                    'это': 'this',
                    'что': 'what',
                    'где': 'where',
                    'когда': 'when',
                    'хорошо': 'good',
                    'плохо': 'bad'
                }
            }
        };

        function initializeSpeechRecognition() {
            if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
                const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
                recognition = new SpeechRecognition();
                
                recognition.continuous = false;
                recognition.interimResults = true;
                recognition.lang = currentSourceLang;

                recognition.onstart = function() {
                    updateStatus('listening', 'Listening...');
                    document.getElementById('inputText').classList.add('listening');
                    document.getElementById('listeningIndicator').classList.add('active');
                };

                recognition.onresult = function(event) {
                    let transcript = '';
                    for (let i = event.resultIndex; i < event.results.length; i++) {
                        transcript += event.results[i][0].transcript;
                    }
                    
                    document.getElementById('inputText').textContent = transcript;
                    
                    if (event.results[event.results.length - 1].isFinal) {
                        translateText(transcript);
                    }
                };

                recognition.onerror = function(event) {
                    showError('Speech recognition error: ' + event.error);
                    resetRecording();
                };

                recognition.onend = function() {
                    resetRecording();
                };
            } else {
                showError('Speech recognition not supported in this browser. Please use Chrome or Edge.');
            }
        }

        function toggleRecording() {
            if (!recognition) {
                initializeSpeechRecognition();
            }

            if (isRecording) {
                recognition.stop();
                resetRecording();
            } else {
                recognition.lang = currentSourceLang;
                recognition.start();
                isRecording = true;
                document.getElementById('recordBtn').textContent = '⏹️ Stop Recording';
                document.getElementById('recordBtn').classList.add('recording');
            }
        }

        function resetRecording() {
            isRecording = false;
            document.getElementById('recordBtn').textContent = '🎤 Start Recording';
            document.getElementById('recordBtn').classList.remove('recording');
            document.getElementById('inputText').classList.remove('listening');
            document.getElementById('listeningIndicator').classList.remove('active');
            updateStatus('idle', 'Ready to translate');
        }

        function translateText(text) {
            updateStatus('processing', 'Translating...');
            document.getElementById('outputText').classList.add('translating');
            
            setTimeout(() => {
                const translation = getTranslation(text.toLowerCase(), currentSourceLang, currentTargetLang);
                document.getElementById('outputText').textContent = translation;
                document.getElementById('outputText').classList.remove('translating');
                currentTranslation = translation;
                document.getElementById('playBtn').disabled = false;
                updateStatus('ready', 'Translation complete');
            }, 1000);
        }

        function getTranslation(text, sourceLang, targetLang) {
            const langDict = translations[sourceLang]?.[targetLang];
            if (!langDict) {
                return 'Translation not available for this language pair';
            }

            // Simple word-by-word translation
            const words = text.split(' ');
            const translatedWords = words.map(word => {
                const cleanWord = word.replace(/[.,!?]/g, '');
                return langDict[cleanWord] || word;
            });

            return translatedWords.join(' ');
        }

        function playTranslation() {
            if (!currentTranslation) return;

            const utterance = new SpeechSynthesisUtterance(currentTranslation);
            
            // Set voice based on target language
            const voices = speechSynthesis.getVoices();
            let voice = null;
            
            if (currentTargetLang === 'en-US') {
                voice = voices.find(v => v.lang.startsWith('en'));
            } else if (currentTargetLang === 'ru-RU') {
                voice = voices.find(v => v.lang.startsWith('ru'));
            }
            
            if (voice) {
                utterance.voice = voice;
            }
            
            utterance.rate = 0.8;
            utterance.pitch = 1;
            
            speechSynthesis.speak(utterance);
        }

        function setLanguagePair(source, target) {
            currentSourceLang = source;
            currentTargetLang = target;
            updateLanguageDisplay();
            
            // Update active button
            document.querySelectorAll('.lang-btn').forEach(btn => {
                btn.classList.remove('active');
            });
            event.target.classList.add('active');
            
            clearTexts();
        }

        function updateLanguageDisplay() {
            document.getElementById('inputTitle').textContent = `Input (${languageNames[currentSourceLang]})`;
            document.getElementById('outputTitle').textContent = `Output (${languageNames[currentTargetLang]})`;
        }

        function clearTexts() {
            document.getElementById('inputText').textContent = 'Click "Start Recording" to speak...';
            document.getElementById('outputText').textContent = 'Translation will appear here...';
            document.getElementById('playBtn').disabled = true;
            currentTranslation = '';
        }

        function updateStatus(type, message) {
            const indicator = document.getElementById('statusIndicator');
            indicator.className = `status-indicator ${type}`;
            indicator.textContent = message;
        }

        function showError(message) {
            const errorDiv = document.getElementById('errorMessage');
            errorDiv.textContent = message;
            errorDiv.style.display = 'block';
            setTimeout(() => {
                errorDiv.style.display = 'none';
            }, 5000);
        }

        // Initialize on page load
        document.addEventListener('DOMContentLoaded', function() {
            initializeSpeechRecognition();
            updateLanguageDisplay();
            
            // Load voices for speech synthesis
            if (speechSynthesis.onvoiceschanged !== undefined) {
                speechSynthesis.onvoiceschanged = function() {
                    // Voices loaded
                };
            }
        });

        // Check for browser support
        if (!('webkitSpeechRecognition' in window) && !('SpeechRecognition' in window)) {
            showError('Speech recognition is not supported in this browser. Please use Chrome or Edge.');
        }

        if (!('speechSynthesis' in window)) {
            showError('Speech synthesis is not supported in this browser.');
        }
    </script>
</body>
</html>
