<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VisitAndijan</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body>

    <main class="hero-section">

                    </div>

                </button>
                
                <button class="action-btn btn-2" onclick="window.location.href='hotels.html'">

                <button class="action-btn btn-4"onclick="window.location.href='dunyo.html'">

                <button class="action-btn btn-5" onclick="window.location.href='booking.html'">

                        <i class="fas fa-user"></i>
                    </div>
                    <span>Saqlanganlar</span>
                </button>
                
                <button class="action-btn btn-6" onclick="window.location.href='information.html'">

        <!-- Snowfall Animation -->

            <div class="snow"></div>
            <div class="snow"></div>
            <div class="snow"></div>
            <div class="snow"></div>
            <div class="snow"></div>
            <div class="snow"></div>
            <div class="snow"></div>
            <div class="snow"></div>
            <div class="snow"></div>
            <div class="snow"></div>
            <div class="snow"></div>
            <div class="snow"></div>
            <div class="snow"></div>
            <div class="snow"></div>
            <div class="snow"></div>
            <div class="snow"></div>
            <div class="snow"></div>
        </div>
        
        <!-- Floating Particles -->
        <div class="particles">
            <div class="particle"></div>
            <div class="particle"></div>
            <div class="particle"></div>

    <script src="script.js"></script>
</body>
</html>

<style>
/* Reset and Base Styles */
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: 'Arial', sans-serif;
    background: url('img/bg.jpg') center/cover no-repeat fixed;
    background-color: #1a1a2e;
    min-height: 100vh;
    overflow-x: hidden;
    position: relative;
}

body::before {
    content: '';
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(0, 0, 0, 0.4);
    z-index: 0;
}

/* Navigation Bar */
.navbar {
    position: fixed;
    top: 0;
    width: 100%;
    background: rgba(255, 255, 255, 0.1);
    backdrop-filter: blur(20px);
    border-bottom: 1px solid rgba(255, 255, 255, 0.2);
    z-index: 1000;
    padding: 1rem 0;
    transition: all 0.3s ease;
}

.nav-container {
    max-width: 1200px;
    margin: 0 auto;
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 0 2rem;
}

.nav-logo span {
    font-size: 1.5rem;
    font-weight: bold;
    color: white;
    text-shadow: 0 2px 10px rgba(0, 0, 0, 0.3);
}

.nav-menu {
    display: flex;
    gap: 2rem;
}

.nav-link {
    color: white;
    text-decoration: none;
    transition: all 0.3s ease;
    position: relative;
    padding: 0.5rem 0;
}

.nav-link:hover {
    color: #ffd700;
    transform: translateY(-2px);
}

.nav-link::after {
    content: '';
    position: absolute;
    bottom: 0;
    left: 0;
    width: 0;
    height: 2px;
    background: #ffd700;
    transition: width 0.3s ease;
}

.nav-link:hover::after {
    width: 100%;
}

.hamburger {
    display: none;
    flex-direction: column;
    cursor: pointer;
}

.hamburger span {
    width: 25px;
    height: 3px;
    background: white;
    margin: 3px 0;
    transition: 0.3s;
}

/* Hero Section */
.hero-section {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    padding: 2rem;
}

.hero-content {
    text-align: center;
    z-index: 2;
    animation: fadeInUp 1s ease-out;
    width: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
}

.main-title {
    font-size: clamp(3rem, 8vw, 6rem);
    font-weight: 900;
    color: white;
    text-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
    margin-bottom: 1rem;
    letter-spacing: 3px;
    animation: glow 2s ease-in-out infinite alternate;
    display: none;
}

.slogan {
    font-size: clamp(1.2rem, 3vw, 1.8rem);
    color: rgba(255, 255, 255, 0.9);
    margin-bottom: 3rem;
    font-weight: 300;
    letter-spacing: 1px;
    display: none;
}

/* Button Grid */
.button-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 2rem;
    max-width: 900px;
    margin: 0 auto;
}

.action-btn {
    background: rgba(255, 255, 255, 0.1);
    backdrop-filter: blur(20px);
    border: 2px solid rgba(255, 255, 255, 0.3);
    border-radius: 20px;
    padding: 2rem 1.5rem;
    color: white;
    cursor: pointer;
    transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    position: relative;
    overflow: hidden;
    min-height: 150px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 1rem;
}

.action-btn:hover {
    transform: translateY(-10px) scale(1.05);
    background: rgba(255, 255, 255, 0.2);
    border-color: #ffd700;
    box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
}

.btn-icon {
    font-size: 2.5rem;
    transition: all 0.3s ease;
}

.action-btn:hover .btn-icon {
    transform: scale(1.2) rotate(5deg);
    color: #ffd700;
}

.action-btn span {
    font-size: 1.1rem;
    font-weight: 600;
    letter-spacing: 1px;
}

/* Button specific colors */
.btn-1:hover { border-color: #ff6b6b; }
.btn-1:hover .btn-icon { color: #ff6b6b; }

.btn-2:hover { border-color: #4ecdc4; }
.btn-2:hover .btn-icon { color: #4ecdc4; }

.btn-3:hover { border-color: #45b7d1; }
.btn-3:hover .btn-icon { color: #45b7d1; }

.btn-4:hover { border-color: #96ceb4; }
.btn-4:hover .btn-icon { color: #96ceb4; }

.btn-5:hover { border-color: #ffa726; }
.btn-5:hover .btn-icon { color: #ffa726; }

.btn-6:hover { border-color: #ab47bc; }
.btn-6:hover .btn-icon { color: #ab47bc; }

/* Snowfall Animation */
.snowfall {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
    z-index: 1;
}

.snow {
    position: absolute;
    top: -10px;
    background: white;
    border-radius: 50%;
    opacity: 0.8;
    animation: snowfall linear infinite;
}

.snow:nth-child(1) {
    left: 10%;
    width: 4px;
    height: 4px;
    animation-duration: 8s;
    animation-delay: 0s;
}

.snow:nth-child(2) {
    left: 20%;
    width: 6px;
    height: 6px;
    animation-duration: 10s;
    animation-delay: 1s;
}

.snow:nth-child(3) {
    left: 30%;
    width: 3px;
    height: 3px;
    animation-duration: 7s;
    animation-delay: 2s;
}

.snow:nth-child(4) {
    left: 40%;
    width: 5px;
    height: 5px;
    animation-duration: 9s;
    animation-delay: 0.5s;
}

.snow:nth-child(5) {
    left: 50%;
    width: 4px;
    height: 4px;
    animation-duration: 11s;
    animation-delay: 1.5s;
}

.snow:nth-child(6) {
    left: 60%;
    width: 7px;
    height: 7px;
    animation-duration: 8s;
    animation-delay: 3s;
}

.snow:nth-child(7) {
    left: 70%;
    width: 3px;
    height: 3px;
    animation-duration: 12s;
    animation-delay: 2.5s;
}

.snow:nth-child(8) {
    left: 80%;
    width: 5px;
    height: 5px;
    animation-duration: 9s;
    animation-delay: 4s;
}

.snow:nth-child(9) {
    left: 90%;
    width: 4px;
    height: 4px;
    animation-duration: 10s;
    animation-delay: 1s;
}

.snow:nth-child(10) {
    left: 5%;
    width: 6px;
    height: 6px;
    animation-duration: 8s;
    animation-delay: 2s;
}

.snow:nth-child(11) {
    left: 15%;
    width: 3px;
    height: 3px;
    animation-duration: 11s;
    animation-delay: 0s;
}

.snow:nth-child(12) {
    left: 25%;
    width: 5px;
    height: 5px;
    animation-duration: 7s;
    animation-delay: 3s;
}

.snow:nth-child(13) {
    left: 35%;
    width: 4px;
    height: 4px;
    animation-duration: 9s;
    animation-delay: 1.5s;
}

.snow:nth-child(14) {
    left: 45%;
    width: 6px;
    height: 6px;
    animation-duration: 10s;
    animation-delay: 0.5s;
}

.snow:nth-child(15) {
    left: 55%;
    width: 3px;
    height: 3px;
    animation-duration: 8s;
    animation-delay: 2.5s;
}

.snow:nth-child(16) {
    left: 65%;
    width: 5px;
    height: 5px;
    animation-duration: 12s;
    animation-delay: 4s;
}

.snow:nth-child(17) {
    left: 75%;
    width: 4px;
    height: 4px;
    animation-duration: 9s;
    animation-delay: 1s;
}

.snow:nth-child(18) {
    left: 85%;
    width: 7px;
    height: 7px;
    animation-duration: 11s;
    animation-delay: 3s;
}

.snow:nth-child(19) {
    left: 95%;
    width: 3px;
    height: 3px;
    animation-duration: 8s;
    animation-delay: 0s;
}

.snow:nth-child(20) {
    left: 12%;
    width: 5px;
    height: 5px;
    animation-duration: 10s;
    animation-delay: 2s;
}
.particles {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    z-index: 1;
}

.particle {
    position: absolute;
    background: rgba(255, 255, 255, 0.1);
    border-radius: 50%;
    animation: float 6s ease-in-out infinite;
}

.particle:nth-child(1) {
    width: 10px;
    height: 10px;
    top: 20%;
    left: 10%;
    animation-delay: 0s;
}

.particle:nth-child(2) {
    width: 15px;
    height: 15px;
    top: 60%;
    left: 80%;
    animation-delay: 2s;
}

.particle:nth-child(3) {
    width: 8px;
    height: 8px;
    top: 40%;
    left: 70%;
    animation-delay: 4s;
}

.particle:nth-child(4) {
    width: 12px;
    height: 12px;
    top: 80%;
    left: 20%;
    animation-delay: 1s;
}

.particle:nth-child(5) {
    width: 6px;
    height: 6px;
    top: 30%;
    left: 50%;
    animation-delay: 3s;
}

/* Social Footer */
.social-footer {
    position: fixed;
    bottom: 0;
    width: 100%;
    background: rgba(0, 0, 0, 0.1);
    backdrop-filter: blur(20px);
    padding: 1rem 0;
    z-index: 1000;
}

.social-container {
    display: flex;
    justify-content: center;
    gap: 2rem;
}

.social-btn {
    width: 50px;
    height: 50px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    color: white;
    font-size: 1.5rem;
    transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    text-decoration: none;
    border: 2px solid rgba(255, 255, 255, 0.3);
}

.social-btn:hover {
    transform: translateY(-5px) scale(1.1);
    box-shadow: 0 10px 20px rgba(0, 0, 0, 0.3);
}

.instagram:hover {
    background: linear-gradient(45deg, #f09433, #e6683c, #dc2743, #cc2366, #bc1888);
    border-color: #e6683c;
}

.telegram:hover {
    background: #0088cc;
    border-color: #0088cc;
}

.facebook:hover {
    background: #1877f2;
    border-color: #1877f2;
}

.tiktok:hover {
    background: linear-gradient(45deg, #ff0050, #00f2ea);
    border-color: #ff0050;
}

/* Animations */
@keyframes fadeInUp {
    from {
        opacity: 0;
        transform: translateY(50px);
    }
    to {
        opacity: 1;
        transform: translateY(0);
    }
}

@keyframes glow {
    from {
        text-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
    }
    to {
        text-shadow: 0 4px 20px rgba(255, 215, 0, 0.3), 0 0 30px rgba(255, 215, 0, 0.2);
    }
}

@keyframes float {
    0%, 100% {
        transform: translateY(0) rotate(0deg);
    }
    50% {
        transform: translateY(-20px) rotate(180deg);
    }
}

/* Responsive Design */
@media (max-width: 768px) {
    .nav-menu {
        display: none;
    }
    
    .hamburger {
        display: flex;
    }
    
    .button-grid {
        grid-template-columns: repeat(2, 1fr);
        gap: 1.5rem;
        max-width: 500px;
    }
    
    .action-btn {
        padding: 1.5rem 1rem;
        min-height: 110px;
    }
    
    .btn-icon {
        font-size: 1.8rem;
    }
    
    .action-btn span {
        font-size: 0.95rem;
    }
    
    .social-container {
        gap: 1rem;
    }
    
    .social-btn {
        width: 45px;
        height: 45px;
        font-size: 1.3rem;
    }
}

@media (max-width: 480px) {
    .button-grid {
        grid-template-columns: repeat(2, 1fr);
        gap: 1rem;
        max-width: 350px;
    }
    
    .action-btn {
        padding: 1.2rem 0.8rem;
        min-height: 90px;
    }
    
    .btn-icon {
        font-size: 1.5rem;
    }
    
    .action-btn span {
        font-size: 0.85rem;
    }
    
    .nav-container {
        padding: 0 1rem;
    }
    
    .hero-section {
        padding: 1rem;
    }
}
</style>

<script>
// Navigation functionality
document.addEventListener('DOMContentLoaded', function() {
    const navbar = document.querySelector('.navbar');
    const hamburger = document.querySelector('.hamburger');
    const navMenu = document.querySelector('.nav-menu');
    
    // Navbar scroll effect
    window.addEventListener('scroll', function() {
        if (window.scrollY > 50) {
            navbar.style.background = 'rgba(255, 255, 255, 0.15)';
            navbar.style.borderBottom = '1px solid rgba(255, 255, 255, 0.3)';
        } else {
            navbar.style.background = 'rgba(255, 255, 255, 0.1)';
            navbar.style.borderBottom = '1px solid rgba(255, 255, 255, 0.2)';
        }
    });
    
    // Mobile menu toggle
    hamburger.addEventListener('click', function() {
        hamburger.classList.toggle('active');
        navMenu.classList.toggle('active');
    });
    
    // Button click animations
    const actionButtons = document.querySelectorAll('.action-btn');
    
    actionButtons.forEach(button => {
        button.addEventListener('click', function() {
            // Create ripple effect
            const ripple = document.createElement('div');
            ripple.classList.add('ripple');
            
            const rect = button.getBoundingClientRect();
            const size = Math.max(rect.width, rect.height);
            const x = event.clientX - rect.left - size / 2;
            const y = event.clientY - rect.top - size / 2;
            
            ripple.style.width = ripple.style.height = size + 'px';
            ripple.style.left = x + 'px';
            ripple.style.top = y + 'px';
            
            button.appendChild(ripple);
            
            setTimeout(() => {
                ripple.remove();
            }, 600);
            
            // Add button feedback
            button.style.transform = 'translateY(-10px) scale(0.95)';
            setTimeout(() => {
                button.style.transform = '';
            }, 150);
        });
    });
    
    // Social media button interactions - REMOVED
    // const socialButtons = document.querySelectorAll('.social-btn');
    
    // socialButtons.forEach(button => {
    //     button.addEventListener('click', function(e) {
    //         e.preventDefault();
            
    //         // Add click animation
    //         button.style.transform = 'translateY(-5px) scale(0.9)';
    //         setTimeout(() => {
    //             button.style.transform = '';
    //         }, 150);
            
    //         // You can add actual social media links here
    //         console.log(`Clicked ${button.classList[1]} button`);
    //     });
    // });
    
    // Parallax effect for particles
    window.addEventListener('scroll', function() {
        const particles = document.querySelectorAll('.particle');
        const scrolled = window.pageYOffset;
        
        particles.forEach((particle, index) => {
            const rate = scrolled * (index + 1) * 0.5;
            particle.style.transform = `translateY(${rate}px)`;
        });
    });
    
    // Add smooth scrolling for nav links
    const navLinks = document.querySelectorAll('.nav-link');
    
    navLinks.forEach(link => {
        link.addEventListener('click', function(e) {
            e.preventDefault();
            
            // Close mobile menu if open
            hamburger.classList.remove('active');
            navMenu.classList.remove('active');
            
            // Add navigation animation
            link.style.color = '#ffd700';
            setTimeout(() => {
                link.style.color = '';
            }, 300);
        });
    });
    
    // Add loading animation
    window.addEventListener('load', function() {
        document.body.classList.add('loaded');
        
        // Animate buttons in sequence
        const buttons = document.querySelectorAll('.action-btn');
        buttons.forEach((button, index) => {
            setTimeout(() => {
                button.style.animation = `fadeInUp 0.6s ease forwards`;
                button.style.animationDelay = `${index * 0.1}s`;
            }, 500);
        });
    });
});

// Add CSS for ripple effect
const style = document.createElement('style');
style.textContent = `
    .ripple {
        position: absolute;
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.3);
        transform: scale(0);
        animation: rippleEffect 0.6s linear;
        pointer-events: none;
    }
    
    @keyframes rippleEffect {
        to {
            transform: scale(2);
            opacity: 0;
        }
    }
    
    .loaded {
        overflow-x: hidden;
    }
`;
document.head.appendChild(style);
</script>
